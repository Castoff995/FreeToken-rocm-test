<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FreeToken Chat</title>
<style>
  body { font-family: system-ui, sans-serif; background:#111; color:#eee; margin:0;
         display:flex; flex-direction:column; height:100vh; }
  header { padding:.6rem 1rem; background:#1b1b1b; border-bottom:1px solid #333; }
  #log { flex:1; overflow-y:auto; padding:1rem; display:flex; flex-direction:column; gap:.6rem; }
  .msg { max-width:75%; padding:.6rem .9rem; border-radius:12px; white-space:pre-wrap; }
  .user { align-self:flex-end; background:#2b5278; }
  .bot  { align-self:flex-start; background:#2a2a2a; }
  form { display:flex; gap:.5rem; padding:.8rem; border-top:1px solid #333; }
  input { flex:1; padding:.7rem; border-radius:8px; border:1px solid #444; background:#222; color:#eee; }
  button { padding:.7rem 1.2rem; border-radius:8px; border:none; background:#2b5278; color:#fff; cursor:pointer; }
  select { padding:.5rem; background:#222; color:#eee; border:1px solid #444; border-radius:8px; }
</style>
</head>
<body>
<header>
  <strong>FreeToken Chat</strong> &nbsp;
  <select id="model"><option>Qwen2.5-3B-Instruct</option></select>
  <span id="stat" style="float:right;color:#888"></span>
</header>
<div id="log"></div>
<form id="f">
  <input id="in" autocomplete="off" placeholder="Type a message…">
  <button>Send</button>
</form>
<script>
const API = location.origin.replace(":1420", ":1919");
const log = document.getElementById("log");
let history = [];

fetch(API + "/v1/models").then(r => r.json()).then(d => {
  const sel = document.getElementById("model");
  sel.innerHTML = "";
  d.data.forEach(m => sel.add(new Option(m.id, m.id)));
}).catch(() => {});

document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const input = document.getElementById("in");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  addMsg("user", text);
  history.push({ role: "user", content: text });
  const bot = addMsg("bot", "…");
  document.getElementById("stat").textContent = "generating…";
  try {
    const t0 = performance.now();
    const r = await fetch(API + "/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: document.getElementById("model").value,
                             messages: history, temperature: 0.7 })
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    const content = d.choices[0].message.content;
    bot.textContent = content;
    history.push({ role: "assistant", content });
    const secs = (performance.now() - t0) / 1000;
    const n = d.usage.completion_tokens;
    document.getElementById("stat").textContent =
      `${n} tok · ${(n / secs).toFixed(1)} tok/s`;
  } catch (err) {
    bot.textContent = "Error: " + err.message;
  }
};

function addMsg(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}
</script>
</body>
</html>
